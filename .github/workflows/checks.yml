name: Original demo and converter checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B tests/run_checks.py --cc gcc
      - name: Verify packed effects against prior production images
        run: |
          mkdir -p "$RUNNER_TEMP/leftfx-base"
          git archive 811fcf5bf7e76c604aa80d929538d6ab527a457a src | tar -x -C "$RUNNER_TEMP/leftfx-base"
          python -B tests/leftfx_host.py --baseline "$RUNNER_TEMP/leftfx-base/src" --out build/leftfx --cc gcc
      - name: Retain effect comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leftfx-host-${{ github.sha }}
          path: build/leftfx
          if-no-files-found: warn
  dos:
    # OpenWatcom build of the DOS game, then the native diagnostic cases in
    # headless DOSBox-X (machine=tandy). Emulation only: not hardware timing.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install DOSBox-X
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dosbox-x
      - name: Install OpenWatcom 2
        run: |
          curl --fail --location -o ow.tar.xz https://github.com/open-watcom/open-watcom-v2/releases/download/2026-10-01-Build/ow-snapshot.tar.xz
          echo 'e6aa1b1e40ac8bbf97658d2c70fff8a4242d6ca4a1c60806f2baa5317083d4fe  ow.tar.xz' | sha256sum --check
          mkdir -p "$RUNNER_TEMP/ow" && tar xJf ow.tar.xz -C "$RUNNER_TEMP/ow"
      - name: Emulated DOS diagnostics
        run: WATCOM="$RUNNER_TEMP/ow" python3 -B tests/dos_smoke.py --keep build/qualified
      - name: Retain exact CI build and native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v6-dos-${{ github.sha }}
          path: build/qualified
          if-no-files-found: error
